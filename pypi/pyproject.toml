# Companion package of the Awaro LoRaWAN gateway: `pip install awaro` brings
# in the lorawan2mqtt USB bridge and exposes it as the `awaro` command
# ("dongle" mode: gateway on USB -> MQTT + Home Assistant discovery).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awaro"
version = "0.2.1"
description = "Companion CLI of the Awaro LoRaWAN gateway (awaro.fr): discover gateways, health status, live decoded frames, USB-to-MQTT/Home Assistant bridge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
maintainers = [{ name = "Awaro" }]
keywords = ["lorawan", "awaro", "gateway", "mqtt", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "lorawan2mqtt>=0.0.2",
]

[project.scripts]
awaro = "awaro.cli:main"

[project.urls]
Homepage = "https://awaro.fr"
Repository = "https://github.com/Di-Ny/awaro"
"Software (lorawan2mqtt)" = "https://github.com/lorawan2mqtt/lorawan2mqtt"

[tool.setuptools.packages.find]
where = ["src"]
